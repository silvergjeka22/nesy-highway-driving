# =============================================================================
# Single source of truth for ALL FOUR PARTS (see README.md for the full plan).
# Nothing is hard-coded in the .py modules — every quantity lives here.
# Loaded once per notebook via utils.load_config().
#
#   Part 1 (baseline) ....... env, shaping, train, rppo, dqn, qrdqn, eval
#   Part 2 (NeSy) ........... rules{}, fsm{}            -> nesy/ + labs/lab3,lab4
#   Part 3 (MetaDrive) ...... metadrive{}, cbf{}, vo{}  -> envs/metadrive_factory + labs/lab1,2,5
#   Part 4 (race) ........... race{}                    -> eval/record_race_video
#
# Rule parameters are taken from Maierhofer et al., "Formalization of Interstate
# Traffic Rules in Temporal Logic", IEEE IV 2020 (Table II). See README.md §4.
# =============================================================================

# ---- Reproducibility ---------------------------------------------------------
seed: 42
eval_seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009]

# ---- Compute + logging (shared by all trainers) ------------------------------
device: cpu           # small MLP policies — CPU is as fast as GPU here. ('auto'/'cuda' also work.)
print_freq: 200       # progress print every N steps (ep_rew_mean, steps/s, ETA, best-ckpt).

# ---- Where results go (mirrored to Drive from the notebooks) -----------------
paths:
  drive_root: /content/drive/MyDrive/nesy-highway-driving
  checkpoints: checkpoints      # <root>/checkpoints/{ppo,dqn,ppo_nesy,md_ppo}.zip
  videos: videos                # <root>/videos/*.mp4
  metrics: metrics              # <root>/metrics/*.json (+ curves/<algo>/progress.csv, *.png)

# =============================================================================
# PART 1 — environment + baselines
# =============================================================================
env:
  id: highway-v0
  config:
    observation:
      type: Kinematics
      vehicles_count: 5
      features: [presence, x, y, vx, vy]
      absolute: false
      normalize: true
      order: sorted
    action:
      type: DiscreteMetaAction
    lanes_count: 4
    vehicles_count: 25        # quick-run: fewer NPCs = faster stepping. Raise to ~50 (denser,
                              # harder traffic — much more to pass) for the FULL run, together
                              # with train.total_timesteps 30k.
    vehicles_density: 1.0
    controlled_vehicles: 1
    duration: 40
    policy_frequency: 2        # 2 decisions/s. At 1 Hz the car gets ONE decision per second at
                              # ~25 m/s closing speeds — collision avoidance is unlearnable and
                              # the crash rate floors at ~100% no matter the penalty (measured).
    simulation_frequency: 10   # quick-run: fewer physics substeps/step (raise to 15 for full)
    collision_reward: -1.0
    right_lane_reward: 0.0     # rewarding the rightmost lane biases AGAINST overtaking
                              # (which happens on the left); drop it so all native reward = speed.
    high_speed_reward: 0.8    # speed is the prerequisite for overtaking (aggression). 0.8 makes a
                              # clean fast episode (~64) dwarf both the passive slow mode (~2-14)
                              # and the crash-sprint (~26) — sample-efficient learners otherwise
                              # converge to "drive slowly forever" (measured: crash 4% but 0.08
                              # overtakes and return ≈ the aggressive mode's).
    lane_change_reward: 0.0
    reward_speed_range: [15, 30]   # floor BELOW the slowest target speed (20): braking to dodge
                              # a car still pays a little, so "slow briefly, then pass" is
                              # learnable; with a floor at 20 braking pays 0 and PPO never brakes.
    normalize_reward: false   # KEY aggression switch. true squashes the per-step reward into
                              # [0,1] with a ~0.67 floor for merely existing, which makes "cruise
                              # slowly, never risk a pass" the global optimum (measured: overtakes
                              # DROP with more training). false pays speed only (~0.5/step at
                              # 30 m/s, ~0 at 20 m/s), so getting ahead is the only way to earn —
                              # the crash cost lives in shaping.collision_penalty below.
    offroad_terminal: true
    render_agent: true
    screen_width: 600
    screen_height: 150
    scaling: 5.5

# Reward shaping (Part 1): make "get ahead" the dominant behaviour while keeping
# crashing clearly worse than cruising. The baseline this produces is deliberately
# AGGRESSIVE (many lane changes/passes) — Part 2 then shows the NeSy layer taming it.
shaping:
  enabled: true
  overtake_bonus: 3.0       # each car passed. ~6 steps of max-speed reward per pass: an 80-step
                            # episode that passes 4 cars earns ~48 vs ~13 for sitting behind a
                            # slow leader — staying behind is clearly the worst legal strategy.
  lane_change_bonus: 1.0    # paid ONLY when a lane change escapes a blocked lane (slow leader
                            # within 25 m) — the first link of the overtaking chain. Without any
                            # bonus the policy never changes lanes (measured: 0 changes); a flat
                            # any-change bonus gets farmed by spamming LANE_LEFT/RIGHT at the
                            # road edge (also measured). The escape version can't be farmed: to
                            # earn it again you must slot behind another slow car and pass it.
                            # (highway-env's own lane_change_reward is dead config for highway-v0.)
  survival_bonus: 0.02      # per step alive — a TIEBREAK, not an income: at 0.1 the guaranteed
                            # 8/episode for merely existing matched the aggressive mode's return
                            # and the policy converged to "hide at low speed, never pass" (measured).
                            # 0.02 still makes braking-for-safety pay > 0 without funding cowardice.
  blocked_penalty: 0.15     # per step stuck behind a close leader (within fsm.follow_gap).
                            # Makes "sit passively behind traffic" the WORST legal state:
                            # blocked-at-20 m/s earns 0.17+0.1-0.15 ≈ 0.12/step vs 0.27 free-slow
                            # vs ~0.6 fast — so the policy escapes (lane change) or backs off.
  offroad_penalty: 0.5      # leaving the road is clearly bad.
  collision_penalty: 8.0    # one-off crash penalty (applied on top of the native -1). With
                            # normalize_reward:false a crash must outweigh the speed earned
                            # by a reckless final sprint (~16 steps at 0.5/step) — this is the
                            # aggression<->safety dial: lower -> more crashes, higher -> timid.

# The ONE training-budget switch — all three algorithms read it, so changing this
# single number keeps the comparison fair by construction.
train:
  total_timesteps: 3000      # fast sanity budget. Raise to 30000 for the REAL run
                             # (below ~20k the value-based learners collapse to a
                             # trivial always-accelerate policy and the comparison
                             # is meaningless).

rppo:                        # RecurrentPPO (PPO-LSTM, sb3-contrib) — on-policy. The LSTM
                             # carries memory across steps, so the identity-swapping sorted
                             # Kinematics rows don't reset its intent mid-overtake: it can
                             # commit to multi-step passes.
  policy: MlpLstmPolicy
  learning_rate: 0.0005
  n_steps: 512               # rollout length before each update (standard for a real run)
  batch_size: 256
  n_epochs: 10
  gamma: 0.98                # 35-step (~18 s) horizon at 2 Hz: long enough to value "after this
                             # pass comes open road and more passes" and to fear the crash that
                             # ends all future reward. 0.95 (10 s) was too short for either.
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.03             # HIGH exploration pressure (SB3 default is 0.0), balanced: at 0.02
                             # the policy settles on FASTER/IDLE and never tries lane changes; at
                             # 0.05 the argmax stays noisy — it spams cancelling LANE_LEFT/RIGHT
                             # requests (both measured on plain PPO).
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch: [256, 256]     # same trunk as DQN/QR-DQN — comparable capacity
    lstm_hidden_size: 128    # the memory that survives the sorted-row identity swaps

dqn:                         # off-policy value-based baseline
  policy: MlpPolicy
  learning_rate: 0.00025          # lower LR curbs DQN's Q-value overestimation/collapse over the run
  buffer_size: 50000
  learning_starts: 1000           # fill the buffer with diverse (incl. safe) transitions before learning
  batch_size: 128                 # steadier gradient estimates
  gamma: 0.98                     # same horizon as RecurrentPPO — fair comparison
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 1000    # a stable target network over the run
  exploration_fraction: 0.5        # ε decays through half the run: long exploration pressure so it
                                   # keeps trying lane changes before it goes greedy
  exploration_final_eps: 0.10      # retain some randomness so it can't commit to a crashing greedy policy
  policy_kwargs:
    net_arch: [256, 256]

qrdqn:                       # QR-DQN (sb3-contrib) — off-policy DISTRIBUTIONAL value learner:
                             # models the full return distribution per action instead of the
                             # mean, so the rare crash spike isn't averaged away — it can tell
                             # "risky fast lane" from "safe fast lane" where DQN sees one number.
  policy: MlpPolicy
  learning_rate: 0.00025          # same optimiser settings as DQN — the ONLY difference is
  buffer_size: 50000              # the distributional head (fair ablation)
  learning_starts: 1000
  batch_size: 128
  gamma: 0.98
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 1000
  exploration_fraction: 0.5       # identical ε schedule to DQN
  exploration_final_eps: 0.10
  policy_kwargs:
    net_arch: [256, 256]
    n_quantiles: 50          # 50 quantiles of the return distribution (default 200 is
                             # oversized for this small obs; 50 keeps the net comparable)

eval:
  episodes_per_seed: 5
  deterministic: true
  video_episodes: 1          # episodes per video when no min length is requested
  video_seconds: 30          # demo/demo.py records a clip at least this long
  video_max_episodes: 60     # cap on episodes stitched together to reach video_seconds
                             # (high enough that even DQN's short crashed episodes hit 30s)
  video_fps: 10

# NeSy-method selection band (Part 2, eval.evaluate.select_nesy_method): configs
# whose overtakes stay within this fraction of the baseline's remain eligible.
# (The Part-1 winner rule — most overtakes, tie -> distance, among models that
# actually pass — lives in the notebook's pick cell.)
select:
  within_return_pct: 0.10    # 10% band below the baseline

# =============================================================================
# PART 2 — NeSy rules (predicates -> shield -> logic-shaped reward)
# Parameter values from Maierhofer 2020, Table II (SI units). car_length and the
# highway-env-scaled v_max are adapted to the simulator; everything else matches
# the paper so each predicate is traceable to a formula. See README.md §4.
# =============================================================================
rules:
  enabled: true
  car_length: 5.0           # vehicle length for gap geometry [m]
  d_near: 10.0              # "near" longitudinal threshold [m]

  # --- RG1 safe distance / safe gap ---
  t_d: 0.3                  # reaction/delay time [s]                 (Table II)
  a_min_ego: -10.0         # max decel, ego [m/s^2]                  (Table II)
  a_min_other: -10.5       # max decel, leader [m/s^2]               (Table II)
  t_c: 3.0                 # cut-in observation window [s]           (Table II)

  # --- RG2 unnecessary braking ---
  a_abrupt: -2.0           # abrupt-braking accel threshold [m/s^2]  (Table II)
  a_max_ego: 5.0

  # --- RG3 speed limit ---
  v_max: 25.0              # lane speed limit [m/s]. Below highway-env's 30 m/s top target
                           # speed so "over the limit" is actually observable (the ego's
                           # discrete target speeds are {20, 25, 30}).
  v_su: 36.66              # suggested speed if no limit [m/s]        (Table II)

  # --- RG4 preserve flow ---
  delta_v_fl: 4.0          # slow-driving margin below the limit [m/s]; ego at the 20 m/s
                           # target (< v_max - delta_v_fl = 21) counts as impeding flow.

  # --- RI1 no stopping ---
  v_err: 0.01              # standstill tolerance [m/s]              (Table II)
  v_stall: 18.0            # highway-env "near standstill": below the ego's slowest normal
                           # target (20 m/s) it was forced to crawl — a forbidden near-stop
                           # (highway-env never fully stops).

  # --- RI2 no passing on the right (exceptions: queue/slow/congestion) ---
  v_con: 2.78              # congestion max velocity [m/s]           (Table II)
  v_smt: 8.33              # slow-moving-traffic velocity [m/s]      (Table II)
  v_qv: 16.67              # vehicle-queue velocity [m/s]            (Table II)
  n_con: 3                 # min vehicles to count as congestion     (Table II)
  slightly_higher_speed: 2.78   # tolerance for "only slightly faster" [m/s]

  # --- RI3 no U-turn / reverse ---
  delta_theta_uturn: 1.57  # U-turn orientation threshold [rad]      (Table II)

  # --- soft-heuristic penalty weights for the logic-shaped reward (Step C) ---
  lambda:
    RI2: 0.50              # passing on the right
    RG4: 0.30              # impeding flow
    RG2: 0.30              # abrupt braking
    overtaken_accel: 0.20  # accelerating while being overtaken

# Finite-state machine (Lab 3) — the symbolic manoeuvre layer / shield host.
fsm:
  initial_state: CRUISE
  states: [CRUISE, FOLLOW, OVERTAKE_LEFT, MERGE, EMERGENCY_STOP]
  follow_gap: 25.0          # below this leader gap -> FOLLOW [m]
  emergency_gap: 8.0        # below this -> EMERGENCY_STOP [m]

# Warm-start fine-tune for the logic-shaped reward (Step C). Lower LR, fewer
# steps than Part 1 — the genuine "fine-tune". 20k is enough for the soft-rule
# penalties (RI2/RG4/RG2) to visibly converge; 1000 was only ever a smoke run.
finetune:
  total_timesteps: 20000     # raise to ~60000 for the fullest fine-tune
  learning_rate: 0.0001

# =============================================================================
# PART 3 — MetaDrive (continuous velocity action) + CBF / velocity obstacles
# MetaDrive-specific APIs that were not available when writing are marked TODO
# in envs/metadrive_factory.py and the labs.
# =============================================================================
metadrive:
  enabled: true
  map: "SSSS"               # straight segments (good for overtaking + racing)
  traffic_density: 0.2
  num_scenarios: 50
  horizon: 1000
  # Continuous velocity action (Lab 1 cmd_vel): a = (v, omega).
  v_max: 10.0               # max commandable linear speed [m/s] (robot scale)
  omega_max: 0.6            # max angular speed [rad/s]
  lidar_num_lasers: 72
  # Video (demo/demo_md.py): 3D chase camera on a GPU runtime, else CPU top-down.
  video_seconds: 30         # clip length (>= 30 s required)
  video_fps: 20             # MetaDrive steps ~ 10 Hz control; 20 fps keeps it smooth
  video_size: [800, 800]    # camera window / top-down film size [px]

# Control Barrier Function (Lab 5) — continuous safety filter on (v, omega).
# Robot-scale thresholds (MetaDrive's (v, omega)); the RG1 barrier itself reuses the
# scale-free SI safe_distance from rules{}, so it is identical to the discrete shield.
cbf:
  enabled: true
  gamma: 1.0                # class-K gain for the barrier: h_dot >= -gamma * h
  v_max: 8.0                # RG3 legal speed limit [m/s] (below the 10 m/s action max,
                            # so the filter actually caps a "go fast" command)
  v_min: 2.0               # RI1: no gratuitous standstill — keep at least this speed
                            # unless RG1/off-road demand braking (safety overrides)
  omega_max: 0.6            # steering-rate actuator limit [rad/s]

# Velocity Obstacles / RVO (Lab 4) — continuous safe-gap + fallback avoidance.
vo:
  enabled: true
  time_horizon: 3.0         # look-ahead [s]
  radius: 1.5               # combined vehicle radius [m]

# =============================================================================
# PART 4 — head-to-head race: baseline agent vs NeSy agent
# =============================================================================
race:
  seeds: [2000, 2001, 2002, 2003, 2004, 2005]   # even count: start slots swap on alternate seeds
  duration: 60              # race length [s] — longer than Part 1's episodes so there is room to pass
  horizon: 1000             # hard safety cap on steps per race
  winner_metric: distance   # "distance" travelled, or "overtakes"
  video_seconds: 30
  sim: highway              # "highway" (Parts 1-2 models) or "metadrive"

# =============================================================================
# Single source of truth for ALL FOUR PARTS (see README.md for the full plan).
# Nothing is hard-coded in the .py modules — every quantity lives here.
# Loaded once per notebook via utils.load_config().
#
#   Part 1 (baseline) ....... env, shaping, ppo, dqn, eval
#   Part 2 (NeSy) ........... rules{}, fsm{}            -> nesy/ + labs/lab3,lab4
#   Part 3 (MetaDrive) ...... metadrive{}, cbf{}, vo{}  -> envs/metadrive_factory + labs/lab1,2,5
#   Part 4 (race) ........... race{}                    -> eval/record_race_video
#
# Rule parameters are taken from Maierhofer et al., "Formalization of Interstate
# Traffic Rules in Temporal Logic", IEEE IV 2020 (Table II). See README.md §4.
# =============================================================================

# ---- Reproducibility ---------------------------------------------------------
seed: 42
eval_seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009]

# ---- Compute + logging (shared by all trainers) ------------------------------
device: cpu           # small MLP policies — CPU is as fast as GPU here. ('auto'/'cuda' also work.)
print_freq: 200       # progress print every N steps (ep_rew_mean, steps/s, ETA, best-ckpt).

# ---- Where results go (mirrored to Drive from the notebooks) -----------------
paths:
  drive_root: /content/drive/MyDrive/nesy-highway-driving
  checkpoints: checkpoints      # <root>/checkpoints/{ppo,dqn,ppo_nesy,md_ppo}.zip
  videos: videos                # <root>/videos/*.mp4
  metrics: metrics              # <root>/metrics/*.json (+ curves/<algo>/progress.csv, *.png)

# =============================================================================
# PART 1 — environment + baselines
# =============================================================================
env:
  id: highway-v0
  config:
    observation:
      type: Kinematics
      vehicles_count: 5
      features: [presence, x, y, vx, vy]
      absolute: false
      normalize: true
      order: sorted
    action:
      type: DiscreteMetaAction
    lanes_count: 4
    vehicles_count: 25        # quick-run: fewer NPCs = faster stepping (raise to ~50 for full)
    vehicles_density: 1.0
    controlled_vehicles: 1
    duration: 40
    policy_frequency: 1
    simulation_frequency: 10   # quick-run: fewer physics substeps/step (raise to 15 for full)
    collision_reward: -1.0
    right_lane_reward: 0.1
    high_speed_reward: 0.4
    lane_change_reward: 0.0
    reward_speed_range: [20, 30]
    normalize_reward: true
    offroad_terminal: true
    render_agent: true
    screen_width: 600
    screen_height: 150
    scaling: 5.5

# Light reward shaping (Part 1). Kept minimal so it does not confound the
# Part-2 NeSy comparison (the plan's explicit warning).
shaping:
  enabled: true
  overtake_bonus: 0.5       # reward passing traffic (native step reward is ~0-0.5, so this
                            # makes each overtake clearly worth it) — still light vs a full
                            # return, so it doesn't confound the Part-2 NeSy comparison.
  offroad_penalty: 0.10     # crash/off-road penalty kept intact.

ppo:
  policy: MlpPolicy
  total_timesteps: 1000 #150000    # full baseline (needed to actually learn to overtake). Use ~2000 for a quick smoke test.
  learning_rate: 0.0005
  n_steps: 512               # rollout length before each update
  batch_size: 256
  n_epochs: 10
  gamma: 0.95
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch: [256, 256]

dqn:
  policy: MlpPolicy
  total_timesteps: 1000 #150000    # full baseline (same budget as PPO for a fair comparison). Use ~2000 for a quick smoke test.
  learning_rate: 0.0005
  buffer_size: 50000
  learning_starts: 100 #1000      # fill the replay buffer a little before learning
  batch_size: 64
  gamma: 0.95
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 250 #1000  # steps between target-network syncs
  exploration_fraction: 0.2
  exploration_final_eps: 0.05
  policy_kwargs:
    net_arch: [256, 256]

eval:
  episodes_per_seed: 5
  deterministic: true
  video_episodes: 1          # episodes per video when no min length is requested
  video_seconds: 30          # evaluate() saves a clip at least this long (PPO and DQN)
  video_max_episodes: 60     # cap on episodes stitched together to reach video_seconds
                             # (high enough that even DQN's short crashed episodes hit 30s)
  video_fps: 10

# Best-model selection rule (Part 1) — explicit, not arbitrary. Among models
# whose mean return is within `within_return_pct` of the top, pick by `rule`.
select:
  within_return_pct: 0.10    # 10% band below the top mean return
  rule: min_crash_rate       # safety-first: lowest crash rate wins (tie -> higher return)

# =============================================================================
# PART 2 — NeSy rules (predicates -> shield -> logic-shaped reward)
# Parameter values from Maierhofer 2020, Table II (SI units). car_length and the
# highway-env-scaled v_max are adapted to the simulator; everything else matches
# the paper so each predicate is traceable to a formula. See README.md §4.
# =============================================================================
rules:
  enabled: true
  car_length: 5.0           # vehicle length for gap geometry [m]
  d_near: 10.0              # "near" longitudinal threshold [m]

  # --- RG1 safe distance / safe gap ---
  t_d: 0.3                  # reaction/delay time [s]                 (Table II)
  a_min_ego: -10.0         # max decel, ego [m/s^2]                  (Table II)
  a_min_other: -10.5       # max decel, leader [m/s^2]               (Table II)
  t_c: 3.0                 # cut-in observation window [s]           (Table II)

  # --- RG2 unnecessary braking ---
  a_abrupt: -2.0           # abrupt-braking accel threshold [m/s^2]  (Table II)
  a_max_ego: 5.0

  # --- RG3 speed limit ---
  v_max: 25.0              # lane speed limit [m/s]. Below highway-env's 30 m/s top target
                           # speed so "over the limit" is actually observable (the ego's
                           # discrete target speeds are {20, 25, 30}).
  v_su: 36.66              # suggested speed if no limit [m/s]        (Table II)

  # --- RG4 preserve flow ---
  delta_v_fl: 4.0          # slow-driving margin below the limit [m/s]; ego at the 20 m/s
                           # target (< v_max - delta_v_fl = 21) counts as impeding flow.

  # --- RI1 no stopping ---
  v_err: 0.01              # standstill tolerance [m/s]              (Table II)
  v_stall: 18.0            # highway-env "near standstill": below the ego's slowest normal
                           # target (20 m/s) it was forced to crawl — a forbidden near-stop
                           # (highway-env never fully stops).

  # --- RI2 no passing on the right (exceptions: queue/slow/congestion) ---
  v_con: 2.78              # congestion max velocity [m/s]           (Table II)
  v_smt: 8.33              # slow-moving-traffic velocity [m/s]      (Table II)
  v_qv: 16.67              # vehicle-queue velocity [m/s]            (Table II)
  n_con: 3                 # min vehicles to count as congestion     (Table II)
  slightly_higher_speed: 2.78   # tolerance for "only slightly faster" [m/s]

  # --- RI3 no U-turn / reverse ---
  delta_theta_uturn: 1.57  # U-turn orientation threshold [rad]      (Table II)

  # --- soft-heuristic penalty weights for the logic-shaped reward (Step C) ---
  lambda:
    RI2: 0.50              # passing on the right
    RG4: 0.30              # impeding flow
    RG2: 0.30              # abrupt braking
    overtaken_accel: 0.20  # accelerating while being overtaken

# Finite-state machine (Lab 3) — the symbolic manoeuvre layer / shield host.
fsm:
  initial_state: CRUISE
  states: [CRUISE, FOLLOW, OVERTAKE_LEFT, MERGE, EMERGENCY_STOP]
  follow_gap: 25.0          # below this leader gap -> FOLLOW [m]
  emergency_gap: 8.0        # below this -> EMERGENCY_STOP [m]

# Warm-start fine-tune for the logic-shaped reward (Step C). Lower LR, fewer
# steps than Part 1 — the genuine "fine-tune".
finetune:
  total_timesteps: 1000      # quick smoke run for now (raise to ~60000 for a full fine-tune)
  learning_rate: 0.0001

# =============================================================================
# PART 3 — MetaDrive (continuous velocity action) + CBF / velocity obstacles
# MetaDrive-specific APIs that were not available when writing are marked TODO
# in envs/metadrive_factory.py and the labs.
# =============================================================================
metadrive:
  enabled: true
  map: "SSSS"               # straight segments (good for overtaking + racing)
  traffic_density: 0.2
  num_scenarios: 50
  horizon: 1000
  # Continuous velocity action (Lab 1 cmd_vel): a = (v, omega).
  v_max: 10.0               # max commandable linear speed [m/s] (robot scale)
  omega_max: 0.6            # max angular speed [rad/s]
  lidar_num_lasers: 72
  # Offscreen top-down video (demo/demo_md.py) — CPU pygame renderer, no GPU.
  video_seconds: 30         # clip length (>= 30 s required)
  video_fps: 20             # MetaDrive steps ~ 10 Hz control; 20 fps keeps it smooth
  video_size: [800, 800]    # top-down film/screen size [px]
  ppo:
    policy: MlpPolicy
    total_timesteps: 2000 #300000   # smoke default; raise to 300000 for a real policy
    learning_rate: 0.0003
    n_steps: 2048
    batch_size: 256
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.0
    policy_kwargs:
      net_arch: [256, 256]

# Control Barrier Function (Lab 5) — continuous safety filter on (v, omega).
# Robot-scale thresholds (MetaDrive's (v, omega)); the RG1 barrier itself reuses the
# scale-free SI safe_distance from rules{}, so it is identical to the discrete shield.
cbf:
  enabled: true
  gamma: 1.0                # class-K gain for the barrier: h_dot >= -gamma * h
  v_max: 8.0                # RG3 legal speed limit [m/s] (below the 10 m/s action max,
                            # so the filter actually caps a "go fast" command)
  v_min: 2.0               # RI1: no gratuitous standstill — keep at least this speed
                            # unless RG1/off-road demand braking (safety overrides)
  omega_max: 0.6            # steering-rate actuator limit [rad/s]

# Velocity Obstacles / RVO (Lab 4) — continuous safe-gap + fallback avoidance.
vo:
  enabled: true
  time_horizon: 3.0         # look-ahead [s]
  radius: 1.5               # combined vehicle radius [m]

# =============================================================================
# PART 4 — head-to-head race: baseline agent vs NeSy agent
# =============================================================================
race:
  seeds: [2000, 2001, 2002, 2003, 2004]
  horizon: 1000
  winner_metric: distance   # "distance" travelled, or "overtakes"
  video_seconds: 30
  sim: highway              # "highway" (Parts 1-2 models) or "metadrive"

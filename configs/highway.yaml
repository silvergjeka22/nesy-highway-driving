# =============================================================================
# Single source of truth for ALL FOUR PARTS of IMPLEMENTATION_PLAN.md.
# Nothing is hard-coded in the .py modules — every quantity lives here.
# Loaded once per notebook via utils.load_config().
#
#   Part 1 (baseline) ....... env, shaping, ppo, dqn, eval
#   Part 2 (NeSy) ........... rules{}, fsm{}            -> nesy/ + labs/lab3,lab4
#   Part 3 (MetaDrive) ...... metadrive{}, cbf{}, vo{}  -> envs/metadrive_factory + labs/lab1,2,5
#   Part 4 (race) ........... race{}                    -> eval/record_race_video
#
# Rule parameters are taken from Maierhofer et al., "Formalization of Interstate
# Traffic Rules in Temporal Logic", IEEE IV 2020 (Table II). See nesy/RULES.md.
# =============================================================================

# ---- Reproducibility ---------------------------------------------------------
seed: 42
eval_seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009]

# ---- Where results go (mirrored to Drive from the notebooks) -----------------
paths:
  drive_root: /content/drive/MyDrive/nesy-highway-driving
  checkpoints: checkpoints      # <root>/checkpoints/{ppo,dqn,ppo_nesy,md_ppo}.zip
  videos: videos                # <root>/videos/*.mp4
  metrics: metrics              # <root>/metrics/*.json
  tensorboard: tb               # <root>/tb/

# =============================================================================
# PART 1 — environment + baselines
# =============================================================================
env:
  id: highway-v0
  fast_id: highway-fast-v0
  config:
    observation:
      type: Kinematics
      vehicles_count: 5
      features: [presence, x, y, vx, vy]
      absolute: false
      normalize: true
      order: sorted
    action:
      type: DiscreteMetaAction
    lanes_count: 4
    vehicles_count: 50
    vehicles_density: 1.0
    controlled_vehicles: 1
    duration: 40
    policy_frequency: 1
    simulation_frequency: 15
    collision_reward: -1.0
    right_lane_reward: 0.1
    high_speed_reward: 0.4
    lane_change_reward: 0.0
    reward_speed_range: [20, 30]
    normalize_reward: true
    offroad_terminal: true
    render_agent: true
    screen_width: 600
    screen_height: 150
    scaling: 5.5

# Light reward shaping (Part 1). Kept minimal so it does not confound the
# Part-2 NeSy comparison (the plan's explicit warning).
shaping:
  enabled: true
  overtake_bonus: 0.05
  offroad_penalty: 0.10

ppo:
  policy: MlpPolicy
  total_timesteps: 200000
  learning_rate: 0.0005
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  gamma: 0.95
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch: [256, 256]
  verbose: 1

dqn:
  policy: MlpPolicy
  total_timesteps: 200000
  learning_rate: 0.0005
  buffer_size: 50000
  learning_starts: 1000
  batch_size: 64
  gamma: 0.95
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 1000
  exploration_fraction: 0.2
  exploration_final_eps: 0.05
  policy_kwargs:
    net_arch: [256, 256]
  verbose: 1

eval:
  episodes_per_seed: 5
  deterministic: true
  video_episodes: 1

# =============================================================================
# PART 2 — NeSy rules (predicates -> shield -> logic-shaped reward)
# Parameter values from Maierhofer 2020, Table II (SI units). car_length and the
# highway-env-scaled v_max are adapted to the simulator; everything else matches
# the paper so each predicate is traceable to a formula. See nesy/RULES.md.
# =============================================================================
rules:
  enabled: true
  car_length: 5.0           # vehicle length for gap geometry [m]
  d_near: 10.0              # "near" longitudinal threshold [m]

  # --- RG1 safe distance / safe gap ---
  t_d: 0.3                  # reaction/delay time [s]                 (Table II)
  a_min_ego: -10.0         # max decel, ego [m/s^2]                  (Table II)
  a_min_other: -10.5       # max decel, leader [m/s^2]               (Table II)
  t_c: 3.0                 # cut-in observation window [s]           (Table II)

  # --- RG2 unnecessary braking ---
  a_abrupt: -2.0           # abrupt-braking accel threshold [m/s^2]  (Table II)
  a_max_ego: 5.0

  # --- RG3 speed limit ---
  v_max: 30.0              # lane speed limit [m/s] (highway-env scale)
  v_su: 36.66              # suggested speed if no limit [m/s]        (Table II)

  # --- RG4 preserve flow ---
  delta_v_fl: 15.0         # slow-driving / flow threshold [m/s]     (Table II)

  # --- RI1 no stopping ---
  v_err: 0.01              # standstill tolerance [m/s]              (Table II)

  # --- RI2 no passing on the right (exceptions: queue/slow/congestion) ---
  v_con: 2.78              # congestion max velocity [m/s]           (Table II)
  v_smt: 8.33              # slow-moving-traffic velocity [m/s]      (Table II)
  v_qv: 16.67              # vehicle-queue velocity [m/s]            (Table II)
  n_con: 3                 # min vehicles to count as congestion     (Table II)
  slightly_higher_speed: 2.78   # tolerance for "only slightly faster" [m/s]

  # --- RI3 no U-turn / reverse ---
  delta_theta_uturn: 1.57  # U-turn orientation threshold [rad]      (Table II)

  # --- soft-heuristic penalty weights for the logic-shaped reward (Step C) ---
  lambda:
    RI2: 0.50              # passing on the right
    RG4: 0.30              # impeding flow
    RG2: 0.30              # abrupt braking
    overtaken_accel: 0.20  # accelerating while being overtaken

# Finite-state machine (Lab 3) — the symbolic manoeuvre layer / shield host.
fsm:
  initial_state: CRUISE
  states: [CRUISE, FOLLOW, OVERTAKE_LEFT, MERGE, EMERGENCY_STOP]
  follow_gap: 25.0          # below this leader gap -> FOLLOW [m]
  emergency_gap: 8.0        # below this -> EMERGENCY_STOP [m]

# Warm-start fine-tune for the logic-shaped reward (Step C). Lower LR, fewer
# steps than Part 1 — the genuine "fine-tune".
finetune:
  total_timesteps: 60000
  learning_rate: 0.0001

# =============================================================================
# PART 3 — MetaDrive (continuous velocity action) + CBF / velocity obstacles
# MetaDrive-specific APIs that were not available when writing are marked TODO
# in envs/metadrive_factory.py and the labs.
# =============================================================================
metadrive:
  enabled: true
  map: "SSSS"               # straight segments (good for overtaking + racing)
  traffic_density: 0.2
  num_scenarios: 50
  horizon: 1000
  # Continuous velocity action (Lab 1 cmd_vel): a = (v, omega).
  v_max: 10.0               # max linear speed [m/s]  (robot scale)
  omega_max: 0.6            # max angular speed [rad/s]
  use_lidar: true
  lidar_num_lasers: 72
  ppo:
    policy: MlpPolicy
    total_timesteps: 300000
    learning_rate: 0.0003
    n_steps: 2048
    batch_size: 256
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.0
    policy_kwargs:
      net_arch: [256, 256]
    verbose: 1

# Control Barrier Function (Lab 5) — continuous safety filter on (v, omega).
cbf:
  enabled: true
  d_safe_min: 5.0           # minimum safe gap [m] -> h(x) = gap - d_safe_min
  gamma: 1.0                # class-K gain for h_dot >= -gamma * h
  v_max: 10.0
  omega_max: 0.6

# Velocity Obstacles / RVO (Lab 4) — continuous safe-gap + fallback avoidance.
vo:
  enabled: true
  time_horizon: 3.0         # look-ahead [s]
  radius: 1.5               # combined vehicle radius [m]

# =============================================================================
# PART 4 — head-to-head race: baseline agent vs NeSy agent
# =============================================================================
race:
  seeds: [2000, 2001, 2002, 2003, 2004]
  horizon: 1000
  winner_metric: distance   # "distance" travelled, or "overtakes"
  video_seconds: 30
  sim: highway              # "highway" (Parts 1-2 models) or "metadrive"

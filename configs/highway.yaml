# Single config for all THREE PARTS (see README.md).
# Part 1 (baseline) — env, shaping, train, ppo, dqn, qrdqn, eval
# Part 2 (NeSy)     — rules, fsm, finetune
# Part 3 (MetaDrive) — metadrive, cbf, vo
# Rule parameters: Maierhofer et al., IEEE IV 2020, Table II.

seed: 42
eval_seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009]

device: cpu
print_freq: 200

paths:
  drive_root: /content/drive/MyDrive/nesy-highway-driving
  checkpoints: checkpoints
  videos: videos
  metrics: metrics

# =============================================================================
# PART 1 — environment + baselines
# =============================================================================
env:
  id: highway-v0
  config:
    observation:
      type: Kinematics
      vehicles_count: 5
      features: [presence, x, y, vx, vy]
      absolute: false
      normalize: true
      order: sorted
    action:
      type: DiscreteMetaAction
    lanes_count: 4
    vehicles_count: 50
    vehicles_density: 1.0
    controlled_vehicles: 1
    duration: 40
    policy_frequency: 2
    simulation_frequency: 10
    collision_reward: -1.0
    right_lane_reward: 0.0
    high_speed_reward: 0.5
    lane_change_reward: 0.0
    reward_speed_range: [20, 30]
    normalize_reward: false
    offroad_terminal: true
    render_agent: true
    screen_width: 600
    screen_height: 150
    scaling: 5.5

shaping:
  enabled: true
  overtake_bonus: 7.0         # aggression dial — each car passed
  lane_change_bonus: 1.0      # paid only when escaping a blocked lane
  survival_bonus: 0.02        # per-step tiebreak, not an income
  blocked_penalty: 0.15       # per step stuck behind a close leader
  offroad_penalty: 0.5
  collision_penalty: 18.0     # must outweigh passes earned in a crash-sprint

train:
  total_timesteps: 20000      # shared budget for all three algorithms

ppo:
  policy: MlpPolicy
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 64
  n_epochs: 10
  gamma: 0.98
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.10              # start of linear decay — high to force lane-change exploration
  ent_coef_final: 0.04        # end of linear decay — still substantial at end of training
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch: [256, 256]

dqn:
  policy: MlpPolicy
  learning_rate: 0.00025
  buffer_size: 50000
  learning_starts: 500
  batch_size: 128
  gamma: 0.98
  train_freq: 1
  gradient_steps: 1
  target_update_interval: 500
  exploration_fraction: 0.6
  exploration_final_eps: 0.10
  policy_kwargs:
    net_arch: [256, 256]

qrdqn:
  policy: MlpPolicy
  learning_rate: 0.00025
  buffer_size: 50000
  learning_starts: 500
  batch_size: 128
  gamma: 0.98
  train_freq: 1
  gradient_steps: 1
  target_update_interval: 500
  exploration_fraction: 0.6
  exploration_final_eps: 0.10
  policy_kwargs:
    net_arch: [256, 256]
    n_quantiles: 50

# MCTS — logic-guided planning (Lab 4, slides 104-118)
mcts:
  n_simulations: 20          # rollouts per decision step
  depth: 3                   # rollout horizon (steps)
  p_heuristic: 0.7           # probability of picking from admissible actions
  gamma: 0.98                # discount factor for rollout returns

eval:
  episodes_per_seed: 5
  deterministic: true
  video_episodes: 1
  video_seconds: 30
  video_max_episodes: 60
  video_fps: 10

select:
  within_return_pct: 0.10     # NeSy method selection band (Part 2)

# =============================================================================
# PART 2 — NeSy rules (Maierhofer 2020, Table II, SI units)
# =============================================================================
rules:
  enabled: true
  car_length: 5.0             # vehicle length [m]
  d_near: 10.0                # "near" threshold [m]

  # RG1 safe distance
  t_d: 0.3                   # reaction time [s]
  a_min_ego: -10.0            # max decel, ego [m/s²]
  a_min_other: -10.5          # max decel, leader [m/s²]
  t_c: 3.0                   # cut-in window [s]

  # RG2 unnecessary braking
  a_abrupt: -2.0              # abrupt-braking threshold [m/s²]
  a_max_ego: 5.0

  # RG3 speed limit
  v_max: 25.0                 # lane speed limit [m/s]
  v_su: 36.66                 # suggested speed [m/s]

  # RG4 preserve flow
  delta_v_fl: 4.0             # slow-driving margin [m/s]

  # RI1 no stopping
  v_err: 0.01                 # standstill tolerance [m/s]
  v_stall: 18.0               # near-standstill threshold [m/s]

  # RI2 no passing on the right
  v_con: 2.78                 # congestion velocity [m/s]
  v_smt: 8.33                 # slow-moving traffic [m/s]
  v_qv: 16.67                # vehicle-queue velocity [m/s]
  n_con: 3                   # min vehicles for congestion
  slightly_higher_speed: 2.78 # tolerance [m/s]

  # RI3 no U-turn
  delta_theta_uturn: 1.57     # orientation threshold [rad]

  # Soft-rule penalty weights (logic-shaped reward, Step C)
  lambda:
    RI2: 0.50
    RG4: 0.30
    RG2: 0.30

fsm:
  initial_state: CRUISE
  states: [CRUISE, FOLLOW, OVERTAKE_LEFT, MERGE, EMERGENCY_STOP]
  follow_gap: 25.0            # FOLLOW trigger [m]
  emergency_gap: 8.0          # EMERGENCY_STOP trigger [m]

finetune:
  total_timesteps: 20000
  learning_rate: 0.0001

# =============================================================================
# PART 3 — MetaDrive + CBF / velocity obstacles
# =============================================================================
metadrive:
  enabled: true
  map: "SSSS"
  traffic_density: 0.3
  num_scenarios: 50
  horizon: 1000
  v_max: 15.0                 # max commandable speed [m/s]
  omega_max: 0.6              # max angular speed [rad/s]
  obs_speed_scale: 4.0        # MetaDrive->highway speed scaling
  lidar_num_lasers: 72
  video_seconds: 30
  video_fps: 20
  video_size: [800, 800]

cbf:
  enabled: true
  gamma: 1.0                  # barrier class-K gain
  v_max: 12.0                 # RG3 speed limit [m/s]
  v_min: 2.0                  # RI1 min speed [m/s]
  omega_max: 0.6

vo:
  enabled: true
  time_horizon: 3.0           # look-ahead [s]
  radius: 1.5                 # combined vehicle radius [m]
